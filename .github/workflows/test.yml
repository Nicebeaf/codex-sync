name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile plugins/codex-sync/skills/codex-sync/scripts/codex_sync.py
      - name: Unit tests
        run: python tests/test_codex_sync.py
      - name: Package test
        run: python tests/test_package.py
